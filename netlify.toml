[build]
  base = "."
  command = "if [ -d frontend ]; then cd frontend; fi && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "og-tags"
  path = "/posts/*"

[[redirects]]
  from = "/users/*"
  to = "/profile/:splat"
  status = 200

[[redirects]]
  from = "/share-target"
  to = "/.netlify/functions/share-target"
  status = 200
  force = true
  conditions = { Method = ["POST"] }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "if [ -d frontend ]; then cd frontend; fi && npm run dev"
  port = 5173
  publish = "frontend/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
