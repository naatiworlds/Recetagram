[build]
  # Directorio donde se encuentra el código fuente
  base = "/"
  
  # Comando para construir el proyecto
  command = "npm run build"
  
  # Directorio donde se generan los archivos de producción
  publish = "dist"

# Edge Functions para meta tags dinámicos en posts
[[edge_functions]]
  function = "og-tags"
  path = "/posts/*"

# Redirecciones específicas para rutas de usuario
[[redirects]]
  from = "/users/*"
  to = "/profile/:splat"
  status = 200

# Redirección general para SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para seguridad y cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Cache para archivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Variables de entorno (opcional)
[build.environment]
  NODE_VERSION = "18" 