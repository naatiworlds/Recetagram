<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#18C894" />
  <!-- Favicon -->
  <link rel="shortcut icon" href="./src/assets/descarga.png" type="image/x-icon">

  <!-- Open Graph Meta Tags -->
  <meta property="og:image" content="https://recetagram.netlify.app/icons/icon-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Recetagram - Comparte tus recetas favoritas">
  <meta property="og:description" content="Descubre y comparte increíbles recetas con la comunidad de Recetagram">
  <meta property="og:url" content="https://recetagram.netlify.app">
  <meta property="og:site_name" content="Recetagram">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Recetagram - Comparte tus recetas favoritas">
  <meta name="twitter:description" content="Descubre y comparte increíbles recetas con la comunidad de Recetagram">
  <meta name="twitter:image" content="https://recetagram.netlify.app/icons/icon-512x512.png">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

  <!-- FontAwesome Script -->
  <script src="https://kit.fontawesome.com/0a9ccace35.js" crossorigin="anonymous"></script>

  <title>Recetagram</title>

  <!-- Estilos para el banner de instalación PWA -->
  <style>
    .pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: #E0F2F1;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    .banner-content {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 10px;
    }

    .banner-icon {
      width: 44px;
      height: 44px;
      background: #4CAF50;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      flex-shrink: 0;
    }

    .banner-text {
      flex: 1;
      min-width: 0;
    }

    .banner-text h4 {
      margin: 0 0 2px 0;
      font-size: 15px;
      font-weight: 700;
      color: #1B5E20;
      font-family: 'Fredoka', sans-serif;
    }

    .banner-text p {
      margin: 0;
      font-size: 13px;
      color: #2E7D32;
      line-height: 1.3;
      font-family: 'Fredoka', sans-serif;
    }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .install-button {
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      font-family: 'Fredoka', sans-serif;
    }

    .install-button:hover {
      background: #45A049;
      transform: translateY(-1px);
    }

    .close-button {
      background: none;
      border: none;
      color: #2E7D32;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      width: 28px;
      height: 28px;
      font-size: 14px;
    }

    .close-button:hover {
      background: rgba(46, 125, 50, 0.1);
      transform: scale(1.1);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .pwa-install-banner {
        bottom: 10px;
        left: 10px;
        right: 10px;
        width: auto;
        transform: none;
      }

      .banner-content {
        padding: 12px;
        gap: 10px;
      }

      .banner-icon {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .banner-text h4 {
        font-size: 15px;
      }

      .banner-text p {
        font-size: 13px;
      }

      .install-button {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- Banner de instalación PWA -->
  <div id="installBanner" style="display:none;" class="pwa-install-banner">
    <div class="banner-content">
      <div class="banner-icon">
        <i class="fas fa-download"></i>
      </div>
      <div class="banner-text">
        <h4>¡Instala Recetagram!</h4>
        <p>Descarga nuestra app para una mejor experiencia</p>
      </div>
      <div class="banner-actions">
        <button id="installBtn" class="install-button">
          <i class="fas fa-download"></i>
          Instalar
        </button>
        <button id="closeBanner" class="close-button" title="Cerrar">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript file -->
  <script type="module" src="/src/main.js"></script>
  <script src="/install.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/sw.js")
        .then(() => {/* Service Worker registered */ })
        .catch((err) => console.error("Error al registrar el Service Worker:", err));
    }
  </script>

</body>

</html>
